name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - 'codex/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore hds.sln

      - name: Build
        run: dotnet build hds.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test hds.sln --configuration Release --no-build --nologo

      - name: Check historical Markdown snapshot policy
        if: github.event_name == 'pull_request'
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 research/abilities/check_snapshot_policy.py --base "$AUDIT_BASE_SHA"

      - name: Test audit snapshot policy
        run: python3 -m unittest research.abilities.test_snapshot_policy

      - name: Generate current ability audit review bundle
        run: |
          mkdir -p artifacts/ability-audit
          dotnet run --project tools/AbilityAudit --configuration Release -- artifacts/ability-audit/server_coverage.json
          python3 research/abilities/build_audit.py --coverage artifacts/ability-audit/server_coverage.json --output-dir artifacts/ability-audit

      - name: Upload current ability audit
        uses: actions/upload-artifact@v4
        with:
          name: ability-audit-${{ github.sha }}
          path: artifacts/ability-audit/
